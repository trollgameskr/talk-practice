<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeminiTalk - Loading...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
    }
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f9fafb;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    /**
     * GitHub Pages SPA 404 리다이렉션 처리
     * 
     * GitHub Pages는 정적 호스팅이므로 직접 경로 접근 시 404 에러가 발생합니다.
     * 이 스크립트는 404 페이지에서 요청한 경로를 읽고 index.html로 리다이렉션하여
     * React Navigation이 올바른 화면을 렌더링할 수 있도록 합니다.
     * 
     * 참고: https://github.com/rafgraph/spa-github-pages
     */
    (function() {
      var basePath = '__BASE_PATH__';
      var pathname = window.location.pathname;
      
      // 이미 basePath로 시작하는 경로인 경우
      if (pathname.startsWith(basePath)) {
        var pathWithoutBase = pathname.slice(basePath.length);
        
        // 빈 경로(trailing slash 없는 base path)인 경우 '/'로 정규화
        if (pathWithoutBase === '') {
          pathWithoutBase = '/';
        }
        
        // 루트 경로가 아닌 경우 (/, /index.html 제외)
        if (pathWithoutBase !== '/' && pathWithoutBase !== '/index.html') {
          // 경로와 쿼리 문자열을 세션 스토리지에 저장
          sessionStorage.setItem('redirectPath', pathWithoutBase + window.location.search);
          
          // index.html로 리다이렉션
          window.location.replace(basePath + '/');
        } else if (pathWithoutBase === '/') {
          // 루트 경로인 경우 trailing slash를 추가하여 리다이렉션
          if (pathname !== basePath + '/') {
            window.location.replace(basePath + '/');
          }
        }
      } else {
        // basePath가 없는 경로인 경우 (로컬 개발 환경)
        if (pathname !== '/' && pathname !== '/index.html') {
          sessionStorage.setItem('redirectPath', pathname + window.location.search);
          window.location.replace('/');
        }
      }
    })();
  </script>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
  </div>
</body>
</html>
